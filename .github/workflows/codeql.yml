name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/**'
  schedule:
    - cron: '26 12 * * 2'

jobs:
  # Determine which parts of the repo changed so we only run the relevant analysis
  paths:
    name: Determine changed areas
    runs-on: ubuntu-latest
    outputs:
      js: ${{ steps.filter.outputs.js }}
      tauri: ${{ steps.filter.outputs.tauri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            js:
              - 'app/**'
              - '!app/src-tauri/**'
            tauri:
              - 'app/src-tauri/**'

  analyze:
    name: Analyze
    needs: paths
    # run only the matrix entries that match changed paths:
    # - javascript when `js` changed
    # - rust when `tauri` changed
    if: |
      (matrix.language == 'javascript' && needs.paths.outputs.js == 'true') ||
      (matrix.language == 'rust' && needs.paths.outputs.tauri == 'true')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'rust' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install dependencies (Rust)
      if: matrix.language == 'rust'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libssl-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev

    - name: Install Rust
      if: matrix.language == 'rust'
      uses: dtolnay/rust-toolchain@stable

    # Initialize CodeQL
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # Queries: security-extended, security-and-quality
        queries: security-extended,security-and-quality

    # Autobuild attempts to build any compiled languages
    - name: Autobuild
      if: matrix.language != 'rust'
      uses: github/codeql-action/autobuild@v3

    # Manual build for Rust to ensure we are in the correct directory
    - name: Manual Build (Rust)
      if: matrix.language == 'rust'
      working-directory: app/src-tauri
      run: |
        cargo build

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
