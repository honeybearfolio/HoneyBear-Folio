name: Backend Tests

on:
  pull_request:
    paths:
      - 'app/src-tauri/**'
  push:
    branches:
      - main
    paths:
      - 'app/src-tauri/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        working-directory: app/src-tauri
        run: |
          set -o pipefail
          cargo llvm-cov --lib --all-features --fail-under-lines 80 \
            --ignore-filename-regex 'lib\.rs$|llm_chat\.rs$|session\.rs$' \
            --lcov --output-path lcov.info --summary-only 2>&1 | tee coverage-summary.txt

      - name: Report backend coverage
        if: always()
        working-directory: app/src-tauri
        run: |
          if [ -f coverage-summary.txt ]; then
            LINE_COV=$(awk '/^TOTAL/ {print $10}' coverage-summary.txt | tr -d '%')
            echo "Backend line coverage: ${LINE_COV}%"
            {
              echo "## Backend line coverage"
              echo ""
              echo "**${LINE_COV}%** line coverage (threshold: 80%)"
              echo ""
              echo '```'
              awk '/^TOTAL|^(accounts|assets|calculations|db_init|io|llm|llm_tools|markets|pdf|rules|scheduled|transactions|utils)\.rs/' coverage-summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: app/src-tauri/lcov.info
          if-no-files-found: error
