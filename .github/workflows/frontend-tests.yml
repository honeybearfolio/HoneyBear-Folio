name: Frontend Tests

on:
  pull_request:
    paths:
      - 'app/**'
  push:
    branches:
      - main
    paths:
      - 'app/**'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./app

    steps:
    - uses: actions/checkout@v7

    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.6"

    - name: Cache Bun dependencies
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lockb') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      run: bun install

    - name: Run tests with coverage
      run: |
        set -o pipefail
        bun run coverage 2>&1 | tee coverage-summary.txt

    - name: Report frontend coverage
      if: always()
      run: |
        if [ -f coverage-summary.txt ]; then
          LINE_COV=$(awk '/^Lines/ {gsub(/%/,"",$3); print $3}' coverage-summary.txt | tail -1)
          echo "Frontend line coverage: ${LINE_COV}%"
          {
            echo "## Frontend line coverage"
            echo ""
            echo "**${LINE_COV}%** line coverage (threshold: 80%)"
            echo ""
            echo '```'
            awk '/^All files|^File|^src\//,/^---/' coverage-summary.txt | tail -n +1 | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload frontend coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: frontend-coverage
        path: app/coverage
        if-no-files-found: error

    - name: Type check
      run: bunx tsc --noEmit

    - name: Build
      run: bun run build
