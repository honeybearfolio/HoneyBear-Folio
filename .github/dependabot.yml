version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "automerge"
    groups:
      actions-all-updates:
        patterns:
          - "*"

  # Maintain dependencies for npm (Bun uses package.json, so npm ecosystem works)
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "automerge"
    # TypeScript 7 has no compiler API yet, so typescript-eslint cannot lint it.
    ignore:
      - dependency-name: "typescript"
        versions: ["7.x"]
    groups:
      npm-all-updates:
        patterns:
          - "*"

  # Maintain dependencies for Rust (Cargo)
  - package-ecosystem: "cargo"
    directory: "/app/src-tauri"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "automerge"
    groups:
      cargo-all-updates:
        patterns:
          - "*"
